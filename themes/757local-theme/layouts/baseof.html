<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.description }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  {{ $css := resources.Get "css/main.css" }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" />
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">757 Local</a>
    <ul class="nav-links">
      <li><a href="/" {{ if .IsHome }}class="active"{{ end }}>Home</a></li>
      <li><a href="/spotlights/">Spotlights</a></li>
      <li><a href="/events/">Events</a></li>
      <li><a href="/contact/" {{ if eq .Title "Contact" }}class="active"{{ end }}>Contact</a></li>
    </ul>
  </nav>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <div class="footer-inner">
      <p>&copy; {{ now.Year }} 757 Local &mdash; Virginia Beach &amp; Norfolk</p>
      <a href="/" class="footer-logo">757 Local</a>
    </div>
  </footer>
</body>
</html>
